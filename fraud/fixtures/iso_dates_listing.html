<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Harbour Studio with Winter Light - Airbnb</title>
    <link rel="canonical" href="https://www.airbnb.com/rooms/73105522">
</head>
<body>
    <h1 data-testid="listing-title">Harbour Studio with Winter Light</h1>
    <p data-testid="listing-subtitle">Entire studio in Reykjavik, Iceland</p>

    <section data-testid="host-overview">
        <div data-testid="host-name">Hosted by Sigrun</div>
        <div data-testid="host-joined">Joined 5 years ago</div>
        <div data-testid="review-count">87 reviews</div>
    </section>

    <section data-testid="book-it-panel">
        <div data-testid="checkin-date" data-date="2026-01-01">Jan 1, 2026</div>
        <div data-testid="checkout-date" data-date="2026-01-05">Jan 5, 2026</div>
        <div data-testid="guest-count">2 guests</div>

        <table data-testid="price-breakdown">
            <tr>
                <td>$200.00 x 4 nights</td>
                <td data-testid="price-row-nights">$800.00</td>
            </tr>
            <tr>
                <td>Cleaning fee</td>
                <td data-testid="price-row-cleaning">$60.00</td>
            </tr>
            <tr>
                <td>Total before taxes</td>
                <td data-testid="price-total">$860.00 total</td>
            </tr>
        </table>
    </section>
</body>
</html>
