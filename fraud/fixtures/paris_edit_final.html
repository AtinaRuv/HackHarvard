<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Confirm and pay - Airbnb</title>
    <link rel="canonical" href="https://www.airbnb.com/rooms/51234567">
</head>
<body>
    <h1>Confirm and pay</h1>
    <div data-testid="listing-title">Sunny Loft near Canal Saint-Martin</div>
    <div data-testid="host-name">Hosted by Camille</div>

    <section data-testid="your-trip">
        <div data-testid="checkin-date" data-date="2026-10-20">Oct 20, 2026</div>
        <div data-testid="checkout-date" data-date="2026-10-23">Oct 23, 2026</div>
        <div data-testid="guest-count">5 guests</div>
    </section>

    <table data-testid="price-breakdown">
        <tr>
            <td>$240.00 x 3 nights</td>
            <td data-testid="price-row-nights">$720.00</td>
        </tr>
        <tr>
            <td>Cleaning fee</td>
            <td data-testid="price-row-cleaning">$90.00</td>
        </tr>
        <tr>
            <td>Airbnb service fee</td>
            <td data-testid="price-row-service">$90.00</td>
        </tr>
        <tr>
            <td>Total (USD)</td>
            <td data-testid="price-total">$900.00 total</td>
        </tr>
    </table>

    <button data-testid="confirm-and-pay">Confirm and pay</button>
</body>
</html>
